services:
  # ── API + Frontend (single container, SERVE_WEB=true) ─────────────────────
  - type: web
    name: autoapply
    runtime: docker
    plan: starter        # 0.5 CPU, 512 MB RAM is enough for API only
    region: singapore
    dockerfilePath: ./docker/api.Dockerfile
    dockerContext: .
    # Runs inside the new container before it goes live.
    # The api.Dockerfile includes prisma CLI so this works.
    preDeployCommand: node node_modules/.bin/prisma migrate deploy --schema prisma/schema.prisma
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "3000"
      - key: SERVE_WEB
        value: "true"
      - key: WEB_DIST_DIR
        value: /app/apps/web/dist
      - key: DATABASE_URL
        fromDatabase:
          name: autoapply-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: autoapply-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
      # APP_URL and API_URL: fallback handled in packages/config/src/index.ts
      # via RENDER_EXTERNAL_URL — no need to hard-code here.
      # Set ALLOWED_ORIGINS to accept requests from the same Render URL.
      - key: ALLOWED_ORIGINS
        value: "" # left blank: RENDER_EXTERNAL_URL is used as fallback in config
      - key: MAX_APPLICATIONS_PER_DAY
        value: "25"
      - key: JOB_DISCOVERY_INTERVAL_MINUTES
        value: "30"
      - key: MAX_CONCURRENT_APPLICATIONS
        value: "2"
      - key: VITE_API_URL
        value: /api
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  # ── Background Workers (Playwright + 6 BullMQ workers) ────────────────────
  - type: worker
    name: autoapply-worker
    runtime: docker
    plan: standard       # 1 CPU, 2 GB RAM required for Playwright Chromium + 6 workers
    region: singapore
    dockerfilePath: ./docker/worker.Dockerfile
    dockerContext: .
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NODE_ENV
        value: production
      - key: PLAYWRIGHT_HEADLESS
        value: "true"
      - key: PLAYWRIGHT_BROWSER
        value: chromium
      # Pull JWT_SECRET from the web service so they share the same key
      - key: JWT_SECRET
        fromService:
          type: web
          name: autoapply
          envVarKey: JWT_SECRET
      # APP_URL / API_URL: derived at runtime from RENDER_EXTERNAL_URL in config
      # but we must provide them explicitly since the worker is a separate service.
      - key: APP_URL
        fromService:
          type: web
          name: autoapply
          property: host
      - key: API_URL
        fromService:
          type: web
          name: autoapply
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: autoapply-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: autoapply-redis
          property: connectionString
      - key: MAX_APPLICATIONS_PER_DAY
        value: "25"
      - key: JOB_DISCOVERY_INTERVAL_MINUTES
        value: "30"
      - key: MAX_CONCURRENT_APPLICATIONS
        value: "2"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  # ── Mock-ATS (staging / QA only — comment out for production) ─────────────
  # This service simulates real career portals for end-to-end testing.
  # Deploy it only in staging environments, NOT in production.
  # Uncomment and set MOCK_ATS_CAPTCHA=never for automated test runs.
  #
  # - type: web
  #   name: autoapply-mock-ats
  #   runtime: docker
  #   plan: free
  #   region: singapore
  #   dockerfilePath: ./docker/mock-ats.Dockerfile
  #   dockerContext: .
  #   healthCheckPath: /health
  #   envVars:
  #     - key: MOCK_ATS_PORT
  #       value: "4000"
  #     - key: MOCK_ATS_CAPTCHA
  #       value: never

  # ── Redis (BullMQ) ─────────────────────────────────────────────────────────
  - type: keyvalue
    name: autoapply-redis
    plan: 256mb
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: autoapply-db
    plan: starter        # 0.5 CPU, 1 GB RAM, 1 GB SSD (free tier → starter for prod)
    region: singapore
    databaseName: autoapply
    user: autoapply
    postgresMajorVersion: "17"
    diskSizeGB: 15
    ipAllowList: []
