services:
  - type: web
    name: autoapply
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./docker/api.Dockerfile
    dockerContext: .
    preDeployCommand: pnpm db:migrate
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: SERVE_WEB
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: autoapply-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: autoapply-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
      - key: MAX_APPLICATIONS_PER_DAY
        value: "25"
      - key: JOB_DISCOVERY_INTERVAL_MINUTES
        value: "30"
      - key: MAX_CONCURRENT_APPLICATIONS
        value: "2"
      - key: VITE_API_URL
        value: /api
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  - type: worker
    name: autoapply-worker
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./docker/worker.Dockerfile
    dockerContext: .
    dockerCommand: pnpm run start:workers
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: autoapply-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: autoapply-redis
          property: connectionString
      - key: MAX_APPLICATIONS_PER_DAY
        value: "25"
      - key: JOB_DISCOVERY_INTERVAL_MINUTES
        value: "30"
      - key: MAX_CONCURRENT_APPLICATIONS
        value: "2"
      - key: PLAYWRIGHT_HEADLESS
        value: "true"
      - key: PLAYWRIGHT_BROWSER
        value: chromium
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  - type: keyvalue
    name: autoapply-redis
    plan: 256mb
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: autoapply-db
    plan: 0.5c-1g
    region: singapore
    databaseName: autoapply
    user: autoapply
    postgresMajorVersion: "17"
    diskSizeGB: 15
    ipAllowList: []
