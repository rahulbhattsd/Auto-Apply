services:
  # ── API + Frontend (single container, SERVE_WEB=true) ─────────────────────
  - type: web
    name: autoapply
    runtime: docker
    plan: starter        # 0.5 CPU, 512 MB RAM
    region: singapore
    dockerfilePath: ./docker/api.Dockerfile
    dockerContext: .
    preDeployCommand: node node_modules/.bin/prisma migrate deploy --schema prisma/schema.prisma
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "3000"
      - key: SERVE_WEB
        value: "true"
      - key: WEB_DIST_DIR
        value: /app/apps/web/dist
      - key: DATABASE_URL
        fromDatabase:
          name: autoapply-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: autoapply-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
      - key: ALLOWED_ORIGINS
        value: "" # left blank: RENDER_EXTERNAL_URL is used as fallback in config
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: VITE_API_URL
        value: /api
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  # ── Background Worker Supervisor (BullMQ workers + self-healing supervisor) ──
  - type: worker
    name: autoapply-worker
    runtime: docker
    plan: starter        # 0.5 CPU, 512 MB RAM sufficient for Node.js workers
    region: singapore
    dockerfilePath: ./docker/worker.Dockerfile
    dockerContext: .
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        fromService:
          type: web
          name: autoapply
          envVarKey: JWT_SECRET
      - key: APP_URL
        fromService:
          type: web
          name: autoapply
          property: host
      - key: API_URL
        fromService:
          type: web
          name: autoapply
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: autoapply-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: autoapply-redis
          property: connectionString
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  # ── Redis (BullMQ) ─────────────────────────────────────────────────────────
  - type: keyvalue
    name: autoapply-redis
    plan: 256mb
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: autoapply-db
    plan: starter
    region: singapore
    databaseName: autoapply
    user: autoapply
    postgresMajorVersion: "17"
    diskSizeGB: 15
    ipAllowList: []
