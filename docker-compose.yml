services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autoapply
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autoapply"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  create-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/autoapply-resumes || true;
      /usr/bin/mc anonymous set public myminio/autoapply-resumes;
      "

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/autoapply?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    command: pnpm db:migrate
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/autoapply?schema=public
      REDIS_URL: redis://redis:6379
      APP_URL: http://localhost:5173
      API_URL: http://localhost:3000
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: autoapply-resumes
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    command: pnpm --filter @autoapply/api dev
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: dev
    ports:
      - "5173:5173"
    env_file: .env
    environment:
      VITE_API_URL: /api
      VITE_API_PROXY_TARGET: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    command: pnpm --filter @autoapply/web dev -- --host 0.0.0.0

  discovery-worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file: .env
    environment: &worker-env
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/autoapply?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: autoapply-resumes
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    depends_on: &worker-depends
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    command: pnpm --filter @autoapply/discovery-worker dev

  analysis-worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file: .env
    environment: *worker-env
    depends_on: *worker-depends
    command: pnpm --filter @autoapply/analysis-worker dev

  resume-worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file: .env
    environment: *worker-env
    depends_on: *worker-depends
    command: pnpm --filter @autoapply/resume-worker dev

  application-worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file: .env
    environment: *worker-env
    depends_on: *worker-depends
    command: pnpm --filter @autoapply/application-worker dev

  verification-worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file: .env
    environment: *worker-env
    depends_on: *worker-depends
    command: pnpm --filter @autoapply/verification-worker dev

  notification-worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file: .env
    environment: *worker-env
    depends_on: *worker-depends
    command: pnpm --filter @autoapply/notification-worker dev

volumes:
  postgres_data:
  redis_data:
  minio_data:
